<!-- views/media.html — Works with mediaManager.js (vanilla) -->

<header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 shadow-sm z-10 flex-shrink-0">
  <div>
    <h1 class="text-xl font-bold text-slate-800">Media Library</h1>
    <p class="text-xs text-slate-500">Manage images, documents, and assets</p>
  </div>

  <div class="flex items-center gap-3">
    <!-- Hidden inputs -->
    <input id="mm-batch-input" type="file" multiple accept="image/*,.pdf,.doc,.docx,.mp4,.mp3" class="hidden">
    <input id="mm-single-input" type="file" accept="image/*,.pdf,.doc,.docx,.mp4,.mp3" class="hidden">

    <button id="mm-batch-btn"
            class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg shadow-lg font-bold text-sm flex items-center transition">
      <i class="fas fa-layer-group mr-2"></i> Mass Upload
    </button>

    <button id="mm-upload-btn"
            class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg shadow-lg font-bold text-sm flex items-center transition">
      <i class="fas fa-cloud-upload-alt mr-2"></i> Upload
    </button>
  </div>
</header>

<!-- CONTENT -->
<div class="flex-1 overflow-y-auto p-8 custom-scrollbar">

  <!-- SEARCH BAR -->
  <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div class="relative w-full sm:w-96">
      <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input id="mm-search" type="text"
             placeholder="Cari file berdasarkan nama, judul, atau tag..."
             class="w-full pl-10 pr-10 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none shadow-sm transition text-sm">
      <button id="mm-clear-search"
              class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-red-500 transition">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="flex items-center gap-3">
      <button id="mm-refresh"
              class="text-xs font-bold text-slate-500 hover:text-slate-800 flex items-center bg-white border border-slate-200 px-3 py-2 rounded-lg shadow-sm transition">
        <i class="fas fa-sync mr-2"></i> Refresh
      </button>
    </div>
  </div>

  <!-- TABS -->
  <div class="flex flex-wrap gap-2 bg-white p-1 rounded-lg border border-slate-200 inline-flex shadow-sm mb-6">
    <button data-mm-tab="all"     class="active px-4 py-1.5 rounded-md text-xs font-bold transition bg-slate-800 text-white shadow">All</button>
    <button data-mm-tab="images"  class="px-4 py-1.5 rounded-md text-xs font-bold transition text-slate-500 hover:bg-slate-50">Images</button>
    <button data-mm-tab="video"   class="px-4 py-1.5 rounded-md text-xs font-bold transition text-slate-500 hover:bg-slate-50">Video</button>
    <button data-mm-tab="audio"   class="px-4 py-1.5 rounded-md text-xs font-bold transition text-slate-500 hover:bg-slate-50">Audio</button>
    <button data-mm-tab="document" class="px-4 py-1.5 rounded-md text-xs font-bold transition text-slate-500 hover:bg-slate-50">Docs</button>
  </div>

  <!-- FILE GRID -->
  <div id="mm-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
    <div class="col-span-full text-center py-12 text-gray-400">
      <i class="fas fa-spinner fa-spin text-3xl"></i>
      <p class="mt-2">Memuat...</p>
    </div>
  </div>

  <!-- PAGINATION -->
  <div id="mm-pagination" class="mt-8 flex justify-center"></div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!--  UPLOAD MODAL                                -->
<!-- ═══════════════════════════════════════════ -->
<div id="mm-upload-modal" class="hidden modal-overlay fixed inset-0 z-50 flex items-center justify-center px-4">
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" data-mm-close="#mm-upload-modal"></div>
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
    <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
      <h3 class="font-bold text-slate-800">Upload Media</h3>
      <button data-mm-close="#mm-upload-modal"><i class="fas fa-times text-slate-400 hover:text-red-500 transition"></i></button>
    </div>
    <div class="p-6 space-y-4">
    <!-- Drop Zone -->
      <div id="mm-drop-zone" class="block w-full h-32 border-2 border-dashed border-slate-300 rounded-xl hover:bg-blue-50 cursor-pointer flex flex-col items-center justify-center transition">
        <i class="fas fa-cloud-upload-alt text-3xl mb-2 text-slate-400"></i>
        <span id="mm-drop-text" class="text-xs font-bold text-slate-500">Click to select file</span>
      </div>


      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Friendly Name</label>
        <input id="mm-upload-title" type="text" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Description</label>
        <textarea id="mm-upload-desc" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
      </div>

      <div class="flex gap-3">
        <button data-mm-close="#mm-upload-modal"
                class="flex-1 py-2 bg-white border border-slate-200 text-slate-600 font-bold rounded-lg text-sm hover:bg-slate-50 transition">
          Cancel
        </button>
        <button id="mm-do-upload"
                class="flex-1 py-2 bg-slate-900 text-white font-bold rounded-lg hover:bg-slate-800 transition">
          <i class="fas fa-cloud-upload-alt mr-2"></i> Upload & Save
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!--  DETAILS / EDIT MODAL                        -->
<!-- ═══════════════════════════════════════════ -->
<div id="mm-details-modal" class="hidden modal-overlay fixed inset-0 z-50 flex items-center justify-center px-4">
  <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm" data-mm-close="#mm-details-modal"></div>
  <div class="relative bg-white rounded-xl shadow-2xl w-full max-w-4xl h-[80vh] flex overflow-hidden">

    <!-- Left: Preview -->
    <div class="w-2/3 bg-slate-950 flex flex-col items-center justify-center relative">
      <img id="mm-detail-preview" src="" class="max-w-full max-h-full object-contain hidden shadow-lg rounded-lg" alt="">
      <div id="mm-detail-icon" class="flex flex-col items-center justify-center text-slate-500">
        <i id="mm-detail-icon-el" class="fas fa-file text-8xl mb-4"></i>
        <span id="mm-detail-ext" class="text-xl font-bold text-slate-400 uppercase"></span>
      </div>
      <p id="mm-detail-filename" class="text-slate-500 text-xs font-mono mt-4 truncate max-w-full px-4"></p>
    </div>

    <!-- Right: Form -->
    <div class="w-1/3 bg-white p-6 flex flex-col">
      <div class="flex justify-between items-center mb-6">
        <h3 class="font-bold text-lg text-slate-800">Edit Details</h3>
        <button data-mm-close="#mm-details-modal" class="text-slate-400 hover:text-red-500 transition"><i class="fas fa-times"></i></button>
      </div>

      <div class="space-y-4 flex-1 overflow-y-auto custom-scrollbar pr-2">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Title</label>
          <input id="mm-detail-title" type="text"
                 class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Description</label>
          <textarea id="mm-detail-desc" rows="4"
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 resize-none transition"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">File Info</label>
          <div class="bg-slate-50 rounded-lg p-3 space-y-1.5 text-xs">
            <div class="flex justify-between">
              <span class="text-slate-400">Size</span>
              <span id="mm-detail-size" class="font-bold text-slate-600"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">Format</span>
              <span id="mm-detail-format" class="font-bold text-slate-600 uppercase"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="mt-4 pt-4 border-t border-slate-100 space-y-2">
        <button id="mm-save-details"
                class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition flex items-center justify-center gap-2">
          <i class="fas fa-save"></i> Update Metadata
        </button>
        <button id="mm-copy-link"
                class="w-full py-2.5 text-slate-600 hover:bg-slate-100 font-bold rounded-lg text-sm transition flex items-center justify-center gap-2 border">
          <i class="fas fa-copy"></i> Copy Link
        </button>
        <button id="mm-delete"
                class="w-full py-2.5 text-red-500 hover:bg-red-50 font-bold rounded-lg text-sm transition flex items-center justify-center gap-2 border border-transparent hover:border-red-200">
          <i class="fas fa-trash"></i> Delete Permanently
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!--  PREVIEW MODAL                              -->
<!-- ═══════════════════════════════════════════ -->
<div id="mm-preview-modal" class="hidden modal-overlay fixed inset-0 z-[60] flex items-center justify-center px-4 bg-black">
  <button data-mm-close="#mm-preview-modal"
          class="absolute top-6 right-6 text-white/60 hover:text-white text-2xl transition z-10">
    <i class="fas fa-times"></i>
  </button>
  <img id="mm-preview-img" src="" class="max-w-[95vw] max-h-[90vh] object-contain shadow-2xl rounded-xl" alt="">
</div>

<script src="/static/admin/js/mediaManager.js"></script>
